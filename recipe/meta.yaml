{% set name = "stream" %}
{% set version = "2.8.26" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  - url: https://github.com/paulscherrerinstitute/StreamDevice/archive/refs/tags/{{ version }}.tar.gz
    sha256: 0c212245fb4626a94e291a6744f5483343b3b896907693c6a71048de68faabc4
  - path: ../src

build:
  number: 3
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - perl
  host:
    - epics-base
    - require
    - asyn
    - calc
    - pcre

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r {{ name }}

about:
  home: https://github.com/paulscherrerinstitute/StreamDevice
  doc_url: https://paulscherrerinstitute.github.io/StreamDevice/
  license: LGPL-3.0
  summary: "EPICS Driver for message based I/O"
