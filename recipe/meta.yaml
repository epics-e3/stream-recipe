{% set version = "2.8.10" %}

package:
  name: streamdevice
  version: "{{ version }}"

source:
  - url: https://github.com/paulscherrerinstitute/StreamDevice/archive/{{ version }}.tar.gz
    sha256: 5836df5f7569f2e153e0d0df2f5a40961c5804aef6f7f37f6409ec70f4fa336c
  - path: ../src

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('streamdevice', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require
    - asyn
    - calc
    - pcre

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r streamdevice

about:
  home: https://github.com/paulscherrerinstitute/StreamDevice
  license: EPICS Open License
  summary: "EPICS Driver for message based I/O"
