{% set version = "2.8.22" %}

package:
  name: stream
  version: "{{ version }}"

source:
  - url: https://github.com/paulscherrerinstitute/StreamDevice/archive/{{ version }}.tar.gz
  - path: ../src

build:
  number: 2
  run_exports:
    - {{ pin_subpackage('stream', max_pin='x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require
    - asyn
    - calc
    - pcre

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r stream

about:
  home: https://github.com/paulscherrerinstitute/StreamDevice
  license: EPICS Open License
  summary: "EPICS Driver for message based I/O"
