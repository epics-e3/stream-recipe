{% set version = "2.8.8" %}

package:
  name: streamdevice
  version: "{{ version }}"

source:
  - url: https://github.com/paulscherrerinstitute/StreamDevice/archive/2.8.8.tar.gz
    sha256: 8512c51452c2fd2a1061176f91d437886ac9c1eeb2ebb03dce11424381f1fb65
  - path: ../src

build:
  number: 2
  run_exports:
    - {{ pin_subpackage('streamdevice', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require
    - asyn
    - calc
    - pcre

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r streamdevice

about:
  home: https://github.com/paulscherrerinstitute/StreamDevice
  license: EPICS Open License
  summary: "EPICS Driver for message based I/O"
