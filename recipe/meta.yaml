{% set version = "2.8.26" %}

package:
  name: stream
  version: "{{ version }}"

source:
  - git_url: https://github.com/paulscherrerinstitute/StreamDevice.git
    git_rev: {{version}}
  - path: ../src

build:
  skip: True  # [ppc64]
  number: 0
  run_exports:
    - {{ pin_subpackage('stream', max_pin='x.x.x') }}

requirements:
  build:
    - make
    - perl
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require
    - asyn
    - calc
    - pcre

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r stream

about:
  home: https://github.com/paulscherrerinstitute/StreamDevice
  license: EPICS Open License
  summary: "EPICS Driver for message based I/O"
